<div class="container">
  <!-- Animated background -->
  <app-auth-background 
    backgroundColor="#f8fafc" 
    orb1Color="#bfdbfe" 
    orb2Color="#a5f3fc">
  </app-auth-background>

  <!-- Register card -->
  <div class="card">
    <div class="card-header">
      <h1 class="title">Crear Cuenta</h1>
      <p class="description">Completa tus datos para registrarte</p>
    </div>

    <div class="card-content">
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="form">
        
        <!-- Error message -->
        @if (errorMessage()) {
          <div class="error-message">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span>{{ errorMessage() }}</span>
          </div>
        }

        <!-- Success message -->
        @if (successMessage()) {
          <div class="success-message">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
              <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            <span>{{ successMessage() }}</span>
          </div>
        }

        <!-- Name input -->
        <div class="input-group">
          <label for="name" class="label">Nombre Completo</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input
              id="name"
              type="text"
              placeholder="Tu nombre completo"
              formControlName="name"
              class="input"
              required
            />
          </div>
        </div>

        <!-- Username input -->
        <div class="input-group">
          <label for="user" class="label">Nombre de Usuario</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input
              id="user"
              type="text"
              placeholder="usuario123"
              formControlName="user"
              class="input"
              required
            />
          </div>
        </div>

        <!-- Email input -->
        <div class="input-group">
          <label for="email" class="label">Email</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="16" rx="2"></rect>
              <polyline points="3,6 12,13 21,6"></polyline>
            </svg>
            <input
              id="email"
              type="email"
              placeholder="tu@gmail.com"
              formControlName="email"
              class="input"
              required
            />
          </div>
        </div>

        <!-- Phone input -->
        <div class="input-group">
          <label for="phone" class="label">Número de Teléfono</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
            <input
              id="phone"
              type="tel"
              placeholder="+1 (555) 123-4567"
              formControlName="phone"
              class="input"
              required
            />
          </div>
        </div>

        <!-- Password input -->
        <div class="input-group">
          <label for="password" class="label">Contraseña</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input
              id="password"
              [type]="showPassword() ? 'text' : 'password'"
              placeholder="••••••••"
              formControlName="password"
              class="input-with-toggle"
              required
            />
            <button type="button" (click)="togglePasswordVisibility()" class="toggle-button">
              @if (showPassword()) {
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              } @else {
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              }
            </button>
          </div>
        </div>

        <!-- Confirm Password input -->
        <div class="input-group">
          <label for="confirmPassword" class="label">Verificar Contraseña</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input
              id="confirmPassword"
              [type]="showConfirmPassword() ? 'text' : 'password'"
              placeholder="••••••••"
              formControlName="confirmPassword"
              class="input-with-toggle"
              required
            />
            <button type="button" (click)="toggleConfirmPasswordVisibility()" class="toggle-button">
              @if (showConfirmPassword()) {
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              } @else {
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              }
            </button>
          </div>
        </div>

        <!-- Terms checkbox -->
        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" formControlName="acceptTerms" class="checkbox" required />
            <span class="checkbox-text">Acepto los términos y condiciones</span>
          </label>
        </div>

        <!-- Submit button -->
        <button type="submit" class="submit-button" [disabled]="isLoading()">
          {{ isLoading() ? 'Creando cuenta...' : 'Crear Cuenta' }}
        </button>

        <!-- Login link -->
        <div class="login-text">
          ¿Ya tienes cuenta? 
          <a routerLink="/login" class="login-link">Inicia sesión aquí</a>
        </div>
      </form>
    </div>
  </div>
</div>
