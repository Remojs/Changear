<div class="container">
  <!-- Animated background -->
  <app-auth-background 
    backgroundColor="#f9fafb" 
    orb1Color="#fed7aa" 
    orb2Color="#fde047">
  </app-auth-background>

  <!-- Login card -->
  <div class="card">
    <div class="card-header">
      <h1 class="title">Bienvenido</h1>
      <p class="description">Ingresa tus credenciales para continuar</p>
    </div>

    <div class="card-content">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="form">
        
        <!-- Error message -->
        @if (errorMessage()) {
          <div class="error-message">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span>{{ errorMessage() }}</span>
          </div>
        }

        <!-- Success message -->
        @if (successMessage()) {
          <div class="success-message">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
              <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            <span>{{ successMessage() }}</span>
          </div>
        }

        <!-- Identifier input (email or username) -->
        <div class="input-group">
          <label for="identifier" class="label">Email o Usuario</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="16" rx="2"></rect>
              <polyline points="3,6 12,13 21,6"></polyline>
            </svg>
            <input
              id="identifier"
              type="text"
              placeholder="tu@gmail.com o usuario123"
              formControlName="identifier"
              class="input"
              required
            />
          </div>
        </div>

        <!-- Password input -->
        <div class="input-group">
          <label for="password" class="label">Contraseña</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input
              id="password"
              [type]="showPassword() ? 'text' : 'password'"
              placeholder="••••••••"
              formControlName="password"
              class="input-with-toggle"
              required
            />
            <button type="button" (click)="togglePasswordVisibility()" class="toggle-button">
              @if (showPassword()) {
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              } @else {
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              }
            </button>
          </div>
        </div>

        <!-- Form options (remember me + forgot password) -->
        <div class="form-options">
          <label class="checkbox-label">
            <input type="checkbox" formControlName="rememberMe" class="checkbox" />
            <span class="checkbox-text">Recordarme</span>
          </label>
          <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>

        <!-- Submit button -->
        <button type="submit" class="submit-button" [disabled]="isLoading()">
          {{ isLoading() ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
        </button>

        <!-- Signup link -->
        <div class="signup-text">
          ¿No tienes cuenta? 
          <a routerLink="/register" class="signup-link">Regístrate aquí</a>
        </div>
      </form>
    </div>
  </div>
</div>
